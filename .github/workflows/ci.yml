name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - run: uv sync
        working-directory: guardrail

      - run: uv run ruff check
        working-directory: guardrail

      - run: uv run pytest
        working-directory: guardrail
